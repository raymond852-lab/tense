  font-size: 16px;
  line-height: 1.6;
  margin: 5px 0;
}

.page-break {
  -moz-column-break-before: page;
       break-before: page;
}

.screen-only {
  display: block;
}

.answer-hidden-note {
  border: 2px dashed var(--ink);
  padding: 16px;
  text-align: center;
  font-weight: 800;
}

@media (max-width: 600px) {
  .paper {
    padding: 24px 18px;
  }

  .pick {
    min-width: 140px;
  }

  .exam-table .pick {
    min-width: 118px;
    padding-left: 8px;
    padding-right: 28px;
    font-size: 15px;
  }

  .school {
    font-size: 23px;
  }

  .exam-title {
    font-size: 20px;
  }

  .grid2, .grid3, .key-grid {
    grid-template-columns: 1fr;
  }

  .line.long {
    min-width: 170px;
  }

  .line {
    min-width: 110px;
  }

  .meta td {
    display: block;
    width: 100%;
    border-top: 0;
  }

  .meta tr:first-child td:first-child {
    border-top: 1.2px solid var(--ink);
  }

  .toolbar-inner {
    padding: 12px;
  }

  table.exam-table {
    font-size: 15px;
  }

  table.exam-table th, table.exam-table td {
    padding: 7px 6px;
  }
}

@page {
  size: A4;

  margin: 14mm 14mm 15mm;
}

@media print {
  html, body, .shell {
    background: #fff !important;
  }

  .shell {
    padding-top: 0 !important;
    min-height: auto;
  }

  .toolbar, .screen-only {
    display: none !important;
  }

  .paper-wrap {
    padding: 0;
  }

  .paper {
    max-width: none;
    margin: 0;
    padding: 0;
    box-shadow: none;
  }

  * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .part {
    -moz-column-break-inside: auto;
         break-inside: auto;
  }

  .q, .card, .key-box {
    -moz-column-break-inside: avoid;
         break-inside: avoid;
  }

  a {
    color: #000;
    text-decoration: none;
  }
}
