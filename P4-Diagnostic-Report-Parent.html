  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition-all {
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-transform {
  transition-property: transform;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --bg:#f2efe8;
  --surface:#fffdf8;
  --surface-2:#f7f2e7;
  --ink:#1d2433;
  --muted:#667085;
  --line:#ddd5c3;
  --primary:#1b2f4e;
  --accent:#c73e2e;
  --amber:#b7790f;
  --green:#1f7a4d;
  --red-soft:#fdf0ed;
  --amber-soft:#fef6dd;
  --green-soft:#eef7f0;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#171a20;
    --surface:#222630;
    --surface-2:#2b303c;
    --ink:#f3efe6;
    --muted:#b9bdc8;
    --line:#454b59;
    --primary:#dbe6f7;
    --accent:#ff8a7a;
    --amber:#f2c14e;
    --green:#6fce9a;
    --red-soft:#3a2625;
    --amber-soft:#3a311f;
    --green-soft:#22392c;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:ui-sans-system,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.serif{
  font-family:Georgia,"Times New Roman",serif
}

.paper{
  box-shadow:0 12px 40px rgba(27,47,78,.10);
  border:1px solid var(--line)
}

.check-row:has(input:checked){
  background:var(--red-soft);
  border-color:#e8b8ae
}

.check-row:has(input:focus-visible){
  outline:3px solid #1b2f4e;
  outline-offset:2px
}

@media print{
  body{
    background:white
  }

  .no-print{
    display:none !important
  }

  .paper{
    box-shadow:none;
    border:1px solid #bbb
  }

  .shell{
    padding:0 !important
  }
}

.focus\:border-\[var\(--primary\)\]:focus {
  border-color: var(--primary);
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:py-8 {
    padding-top: 2rem;
    padding-bottom: 2rem;
  }

  .sm\:text-4xl {
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-\[54px\] {
    font-size: 54px;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-\[1\.2fr_\.8fr_1fr\] {
    grid-template-columns: 1.2fr .8fr 1fr;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

fter go.",drill:"Sort 12 cards into play / go / do / read, then say each one aloud: “go swimming.”",risk:4,riskNote:"Appears in grammar + speaking."},{id:"1.2",code:"1.2",title:"Forgets THE with instruments",chinese:"樂器要加 the",example:"Says “play piano”",plain:"She has not yet learned the rule: play the piano / play the guitar — musical instruments need the.",why:"In everyday talk we drop words, so she copies “play piano.” The exam still wants the.",drill:"Point to 6 instruments and say “play the ___” each time. Cover the word the and recall it.",risk:3,riskNote:"Easy mark to lose in grammar."},{id:"1.3",code:"1.3",title:"Confuses do / go",chinese:"do / go 分不清",example:"Says “go puzzles”",plain:"She has not yet learned which activities go with do: do puzzles, do homework, do exercise.",why:"She is guessing from meaning (“go to do something”) instead of remembering fixed pairs.",drill:"Make a two-column poster: do = puzzles / homework / yoga. go = swimming / jogging / fishing.",risk:3,riskNote:"Common fixed-phrase question."},{id:"1.4",code:"1.4",title:"Forgets -s for He / She",chinese:"He / She 要加 -s",example:"Writes “He go jogging”",plain:"She has not yet learned the He / She rule: He + verb-s. So she writes He go instead of He goes.",why:"She memorises the word “go,” but not the sentence formula. When the subject changes, the verb does not change in her mind.",drill:"Change I → He for 10 sentences. Say the -s out loud every time: “He goes. She plays.”",risk:5,riskNote:"Highest-frequency grammar mark."},{id:"1.5",code:"1.5",title:"Wrong adverb position",chinese:"頻率副詞位置錯",example:"Writes “I am always go” / “I play always”",plain:"She has not yet learned where always / usually / never goes: before the main verb, after am / is / are.",why:"She knows the word always, but not its seat in the sentence — so it floats to the end.",drill:"Use a slot strip: I [always] play. I am [always] happy. Move always into the box, never to the end.",risk:5,riskNote:"Tested in word order + writing."},{id:"1.6",code:"1.6",title:"Cannot read frequency table",chinese:"看不懂頻率表",example:"Cannot explain 7/7 or 0/7",plain:"She cannot yet turn a table into a sentence: 7/7 = always, 0/7 = never. The numbers feel separate from the words.",why:"She reads the table as maths, not as “how many days does she do it?”",drill:"For 7/7, 5/7, 0/7: ask “How many days?” then choose always / usually / never and make one sentence.",risk:4,riskNote:"Reading-to-write transfer."}]},{id:"g2",kicker:"UNIT 3",title:"Could / Couldn't + Reflexive Pronouns",chinese:"Could + 反身代詞",intro:"This unit is about past ability and doing things alone. The patterns are short, so the exam expects them to be exact.",items:[{id:"2.1",code:"2.1",title:"Uses could + -ed",chinese:"could 後面加了 -ed",example:"Writes “could walked”",plain:"She has not yet learned that could is always followed by the base verb: could walk — never could walked.",why:"She knows the past story needs -ed, so she adds it twice: once in could, once in the verb.",drill:"Cover test: could + ___ . Fill with walk / swim / read, never walked / swam. Say “could” = past already.",risk:5,riskNote:"Very common APSW trap."},{id:"2.2",code:"2.2",title:"Forgets the when clause",chinese:"忘記 when 句子",example:"Writes only “I could swim”",plain:"She can write could, but she does not yet add when to show the time: when I was five.",why:"She answers the question, but does not add the time detail the question asks for.",drill:"Finish every could sentence with when I was ___ . Use 3 ages and 3 abilities.",risk:4,riskNote:"Loses detail marks in writing."},{id:"2.3",code:"2.3",title:"Adds s: himselfs, themselves",chinese:"加多個 s",example:"Writes “himselfs”",plain:"She thinks reflexive pronouns follow the plural rule, so she adds s: himselfs. The correct forms never add s.",why:"She is over-using the “add s for more” rule she learned earlier.",drill:"Flash the 8 correct forms only: myself, yourself, himself, herself, itself, ourselves, yourselves, themselves.",risk:3,riskNote:"Spelling + grammar mark."},{id:"2.4",code:"2.4",title:"Confuses singular / plural forms",chinese:"單數 / 複數分不清",example:"Mixes himself vs themselves",plain:"She has not yet matched the pronoun to the person: he → himself, they → themselves; you (one) → yourself, you (many) → yourselves.",why:"She memorises the list, but does not link each form back to who is doing it.",drill:"Match game: I → myself, he → himself, they → themselves. Say the pair, not the word alone.",risk:5,riskNote:"Direct grammar + writing mark."},{id:"2.5",code:"2.5",title:"Does not know by myself = without help",chinese:"by myself = 自己一個人",example:"Cannot explain “by myself”",plain:"She does not yet know that by myself means “without help / on my own,” not “next to me.”",why:"She reads by as a place word, not as part of a fixed phrase.",drill:"Act out 4 examples: “I did my homework by myself.” Ask: “Did someone help?” — No.",risk:3,riskNote:"Comprehension + writing."}]},{id:"g3",kicker:"UNIT 4",title:"Was / Were There + Nobody / Everybody",chinese:"Was / Were + Nobody / Everybody",intro:"This unit tests whether she checks singular / plural before she chooses was / were or have / has.",items:[{id:"3.1",code:"3.1",title:"Uses was for plural",chinese:"複數用了 was",example:"Asks “Was there any buses?”",plain:"She has not yet learned to check the noun first: buses = plural, so the question needs Were there any buses?",why:"Was feels like the “past word,” so she uses it for everything. She is not stopping to check one vs many.",drill:"First circle the noun: bus / buses. Then choose: one → Was there a…? many → Were there any…?",risk:5,riskNote:"Core Unit 4 grammar."},{id:"3.2",code:"3.2",title:"Confuses was / were in answers",chinese:"回答 was / were 混淆",example:"Answers “Yes, there was” for buses",plain:"She can ask the question, but the short answer does not yet match: Yes, there were. / No, there wasn’t.",why:"She learns the question and answer as two separate pieces, not as a pair that must agree.",drill:"Pair drill: Were there any…? → Yes, there were. / No, there weren’t. Practise as a pair, not alone.",risk:4,riskNote:"Short-answer marks."},{id:"3.3",code:"3.3",title:"Uses have / has with Nobody",chinese:"Nobody 配 have / has 錯",example:"Writes “Nobody have…”",plain:"She has not yet learned that Nobody is singular in English: Nobody has… / Nobody was…",why:"Nobody sounds like “many people = zero,” so she picks a plural verb.",drill:"Rule card: Nobody = one person in grammar → has / was / is. Rewrite 5 sentences with has.",risk:5,riskNote:"High-value APSW pattern."},{id:"3.4",code:"3.4",title:"Uses plural verb with Everybody",chinese:"Everybody 配複數動詞",example:"Writes “Everybody have…”",plain:"She has not yet learned that Everybody is also singular: Everybody has… / Everybody was…",why:"Everybody sounds like a crowd, so she chooses a plural verb even though the rule is singular.",drill:"Same rule card: Everybody = singular → has / was. Contrast: Everybody has / They have.",risk:5,riskNote:"High-value APSW pattern."},{id:"3.5",code:"3.5",title:"Confuses Did anybody have vs Nobody had",chinese:"Did anybody / Nobody had 混淆",example:"Mixes question and answer forms",plain:"She has not yet learned the pair: Question = Did anybody have…? Answer = Nobody had…",why:"Did + have and had look like three different rules. She has not yet seen them as one question-answer pair.",drill:"Two-line drill: Did anybody have a ticket? → Nobody had a ticket. Keep have in Q, had in A.",risk:4,riskNote:"Question-answer transfer."}]},{id:"g4",kicker:"PHONICS & READING",title:"Sounds, Syllables & Finding Information",chinese:"拼音 + 閱讀找資料",intro:"These are reading skills, not just spelling. If she cannot hear the sound, she cannot choose the right answer.",items:[{id:"4.1",code:"4.1",title:"Cannot count syllables",chinese:"數不到音節",example:"Cannot clap out syllables",plain:"She cannot yet break a word into beats: e.g. bas-ket-ball = 3. So longer words feel like one blur.",why:"She is reading with her eyes only. She has not yet learned to clap / tap the beats.",drill:"Clap + chin-drop: say the word slowly, count chin drops. Start with 1–3 beat words.",risk:3,riskNote:"Phonics + vocabulary."},{id:"4.2",code:"4.2",title:"Cannot hear silent b",chinese:"聽不到 silent b",example:"Misses silent b in climb / comb",plain:"She has not yet learned that b after m is silent: climb, comb, lamb — we say the m, not the b.",why:"She sounds out every letter she sees, so a silent letter feels like a trick.",drill:"Sort: silent b (climb, comb) vs spoken b (bus, ball). Say each, cross out the silent b.",risk:3,riskNote:"Listening + spelling."},{id:"4.3",code:"4.3",title:"Cannot hear -ed endings /id/ /t/ /d/",chinese:"聽不到 -ed 三種讀音",example:"Cannot sort /id/ /t/ /d/",plain:"She has not yet learned that -ed has three sounds: wanted (/id/), walked (/t/), played (/d/).",why:"She sees one spelling (-ed) and expects one sound. The three sounds feel random.",drill:"Sort 9 verbs by mouth: /id/ after t/d, /t/ after voiceless, /d/ after voiced. Say, don’t just read.",risk:4,riskNote:"Listening is tested directly."},{id:"4.4",code:"4.4",title:"Cannot find info in Notice / Brochure",chinese:"找不到通告 / 單張資料",example:"Cannot find Title, Time, Fee",plain:"She reads the whole text instead of scanning for the question words: Title, Time, Fee, Place.",why:"She reads top-to-bottom like a story. She has not yet learned to read the question first, then hunt.",drill:"Question-first drill: read Q, underline Title / Time / Fee, then scan only for those words.",risk:4,riskNote:"Reading comprehension marks."}]},{id:"g5",kicker:"WRITING",title:"Time Travel Journal",chinese:"寫作：時光旅行日記",intro:"This is where all the grammar comes together. A small grammar slip here costs marks in organisation and language.",items:[{id:"5.1",code:"5.1",title:"Writes in present tense, not past",chinese:"用了現在式，不是過去式",example:"Writes “I go” in a past story",plain:"In a past story she still writes present tense: I go instead of I went. The time of the story is not yet controlling the verbs.",why:"She writes what she would say today. She has not yet switched the whole story into the past.",drill:"Before writing, list 6 past verbs: went, saw, had, was, could, played. Check each verb against the list.",risk:5,riskNote:"Biggest writing mark loss."},{id:"5.2",code:"5.2",title:"Missing 4 paragraphs / 5W1H",chinese:"缺少 4 段 / 5W1H",example:"Story is one long paragraph",plain:"She has not yet planned 4 paragraphs with 5W1H: Who, When, Where, What, Why, How.",why:"She starts writing before planning, so ideas come out in one block and details get missed.",drill:"Fill a 4-box plan first: P1 When/Where, P2 What happened, P3 Problem, P4 Feeling/Ending. No plan = no writing.",risk:5,riskNote:"Organisation marks."},{id:"5.3",code:"5.3",title:"Missing Nobody / Everybody or could / couldn't",chinese:"沒有用 Nobody / could",example:"Story has no target grammar",plain:"Her story does not yet include the target grammar: Nobody / Everybody or could / couldn’t.",why:"She writes a free story, then forgets the exam asks her to show those patterns.",drill:"Plan two must-use sentences: “Nobody could…” and “Everybody was…”. Tick them off after writing.",risk:4,riskNote:"Content + language marks."},{id:"5.4",code:"5.4",title:"No adjectives / feelings",chinese:"沒有形容詞 / 感受",example:"Story is only actions",plain:"Her story lists actions but has no adjectives or feelings: happy, scared, amazing, tired.",why:"She thinks writing = what happened. She has not yet learned that feeling words earn marks too.",drill:"Add 3 feeling words + 2 describing words after the first draft. Circle them in colour.",risk:3,riskNote:"Vocabulary + feeling marks."}]}],$t=Zl.flatMap((e)=>e.items),wu=(e)=>e===0?{label:"Strong",cls:"bg-[var(--green-soft)] text-[var(--green)]",bar:"bg-[var(--green)]"}:e===1?{label:"Need Work",cls:"bg-[var(--amber-soft)] text-[var(--amber)]",bar:"bg-[var(--amber)]"}:{label:"At Risk",cls:"bg-[var(--r
