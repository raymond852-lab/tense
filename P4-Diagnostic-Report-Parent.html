:root{
  --bg:#e8e4d8;
  --surface:#fffdf4;
  --paper:#fffdf4;
  --ink:#1a2433;
  --muted:#5b6675;
  --line:#c9c2ae;
  --primary:#1b4a7a;
  --primary-ink:#ffffff;
  --accent:#b45309;
  --green:#166534;
  --green-bg:#dcfce7;
  --red:#991b1b;
  --red-bg:#fee2e2;
  --amber-bg:#fef3c7;
  --soft:#eef3f8;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161d;

    --muted:#aab4c2;

  }
}
*{
  box-sizing:border-box
}
html{
  scroll-behavior:smooth
}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:ui-sans-system,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.font-paper{
  font-family:Georgia,"Times New Roman",serif
}
input,select{
  font:inherit
}
.paper-shadow{
  box-shadow:0 10px 30px rgba(20,30,45,.14)
}
.option-btn{
  transition:transform .08s ease, background .15s ease, border-color .15s ease
}
.option-btn:active{
  transform:scale(.98)
}
@media print{
  .no-print{
    display:none!important
  }
  body{
    background:#fff
  }
}
.hover\:border-\[var\(--primary\)\]:hover {

}

}
.focus\:ring-\[var\(--primary\)\]:focus {
  --tw-ring-color: var(--primary);
}

    display: block;
  }
  .sm\:hidden {
    display: none;
  }

    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

    flex-direction: row;
  }
  .sm\:p-5 {
    padding: 1.25rem;
  }
  .sm\:p-6 {
    padding: 1.5rem;
  }

  }
  .sm\:py-7 {

  }
  .sm\:pt-6 {
    padding-top: 1.5rem;
  }
  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }
  .sm\:text-4xl {
    font-size: 2.25rem;
    line-height: 2.5rem;
  }
